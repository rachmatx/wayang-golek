<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>QA responsif — Wayang Jawa Timuran</title><style>
body{margin:0;background:#38342e;color:#f4eadb;font:13px system-ui}header{display:flex;gap:10px;align-items:center;padding:14px;position:sticky;top:0;background:#23201b;z-index:2}button{border:1px solid #bc955d;color:#f4eadb;background:#38342e;border-radius:4px;padding:10px;cursor:pointer}main{padding:20px;overflow:auto}iframe{display:block;border:1px solid #bc955d;background:#151310;width:390px;height:844px;max-width:none;margin:auto}header span{margin-left:auto}
</style></head><body><header><strong>QA responsif</strong><button data-width="390" data-height="844">Ponsel 390 × 844</button><button data-width="1366" data-height="768">Laptop 1366 × 768</button><button data-width="1440" data-height="900">Desktop 1440 × 900</button><span id="size">390 × 844</span></header><main><iframe title="Pratinjau aplikasi" src="/"></iframe></main><script>
document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{const frame=document.querySelector('iframe');frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.height+'px';document.querySelector('#size').textContent=button.dataset.width+' × '+button.dataset.height;}));
</script></body></html>
