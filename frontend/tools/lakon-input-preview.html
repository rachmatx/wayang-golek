<!doctype html><html lang="id"><head><meta charset="utf-8"><title>QA kamera simulasi dan lakon</title><style>
body{margin:0;background:#29241c;color:#f5ead9;font:12px system-ui}header{padding:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}button{background:#393026;color:inherit;border:1px solid #b7945e;padding:10px;cursor:pointer}iframe{display:block;border:0;width:100%;height:870px}#input{color:#e9c893}</style></head><body><header><strong>SIMULASI TRANSPORT KAMERA — BUKAN WEBCAM FISIK</strong><button data-gesture="telapak_terbuka" data-x=".85">Tangan kanan: Telapak</button><button data-gesture="telunjuk" data-x=".85">Tangan kanan: Telunjuk</button><button data-gesture="telunjuk" data-x=".15">Tangan kiri: Telunjuk</button><button data-gesture="kepalan" data-x=".85">Tangan kanan: Kepalan</button><button data-gesture="dua_jari" data-x=".15">Tangan kiri: Dua jari</button><button data-gesture="none">Tanpa tangan</button><span id="input">Belum ada tangan</span></header><iframe title="Panggung uji kamera simulasi"></iframe><script>
const frame=document.querySelector('iframe');fetch('/').then(r=>r.text()).then(html=>{frame.srcdoc=html.replace('<head>','<head><base href="/"><script src="/__qa/camera-fixture.js"><'+ '/script>');});
document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{const hands=button.dataset.gesture==='none'?[]:[{id:77,wrist_x:Number(button.dataset.x),gesture:button.dataset.gesture,state:'ok',confidence:.98,landmarks:[]}];frame.contentWindow.postMessage({type:'qa-camera',hands},location.origin);document.querySelector('#input').textContent=hands.length?'id77 · '+button.textContent:'Tidak ada tangan';}));
</script></body></html>
